- type: entity
  parent: MobHuman
  id: MobLivingStationEngineer
  name: station engineer
  components:
  - type: InputMover
  - type: MobMover
  - type: Loadout
    prototypes: [LivingStationEngineerGear]
    roleLoadout: [JobStationEngineer]
  - type: NpcFactionMember
    factions: [NanoTrasen]
  - type: Access
    tags: [Engineering, ChiefEngineer, Maintenance, Atmospherics, Cargo]
  - type: LivingStationEngineer
  - type: HTN
    enabled: false
    rootTask:
      task: IdleCompound
    blackboard:
      NavInteract: !type:Bool
        true

- type: startingGear
  parent: StationEngineerGear
  id: LivingStationEngineerGear
  inhand:
  - LightReplacerFilled
  - WelderIndustrial

- type: entity
  parent: MobLivingStationEngineer
  id: MobLivingStationChiefEngineer
  name: chief engineer
  components:
  - type: Loadout
    prototypes: [LivingStationChiefEngineerGear]
    roleLoadout: [JobChiefEngineer]

- type: startingGear
  parent: ChiefEngineerGear
  id: LivingStationChiefEngineerGear
  equipment:
    ears: LivingStationChiefEngineerHeadset
    back: ClothingBackpackEngineering
    outerClothing: ClothingOuterHardsuitEngineeringWhite
    head: ClothingHeadHelmetHardsuitEngineeringWhite
    mask: ClothingMaskBreath
    suitstorage: OxygenTankFilled
  storage:
    back:
    - CableApcStack10
    - FloorTileItemSteel
  inhand:
  - LightReplacerFilled
  - WelderIndustrial

- type: entity
  parent: ClothingHeadsetCE
  id: LivingStationChiefEngineerHeadset
  name: chief engineer's emergency headset
  description: A command headset with a direct transmitter for use during station telecom outages.
  components:
  - type: TelecomExempt
